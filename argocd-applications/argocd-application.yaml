apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/my-janala/eks-cluster-template.git'  # Replace with the Git repository URL
    targetRevision: eks-env-template
    path: 'helm/gitlab-helm/'  # Path to the directory containing your Helm chart
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: gitlab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true